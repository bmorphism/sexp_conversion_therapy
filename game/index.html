<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sexp Defenders</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a1a;
  color: #e0e0e0;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

#hud {
  width: 100%;
  max-width: 800px;
  display: flex;
  justify-content: space-between;
  padding: 10px 20px;
  font-size: 16px;
  color: #7fdbca;
  z-index: 10;
}

#hud span { display: inline-block; min-width: 120px; }

canvas {
  border: 1px solid #1a3a4a;
  background: #0a0a1a;
  display: block;
  cursor: none;
}

#start-screen, #game-over-screen {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(10, 10, 26, 0.95);
  z-index: 100;
}

#start-screen h1, #game-over-screen h1 {
  font-size: 48px;
  color: #7fdbca;
  margin-bottom: 10px;
  text-shadow: 0 0 20px rgba(127, 219, 202, 0.5);
}

#start-screen .subtitle {
  color: #c792ea;
  font-size: 18px;
  margin-bottom: 40px;
}

#game-over-screen .final-score {
  color: #f78c6c;
  font-size: 28px;
  margin: 20px 0;
}

.instructions {
  color: #a0a0c0;
  font-size: 14px;
  line-height: 2;
  text-align: center;
  margin-bottom: 30px;
}

.instructions kbd {
  background: #1a2a3a;
  border: 1px solid #3a5a6a;
  border-radius: 4px;
  padding: 2px 8px;
  color: #7fdbca;
}

button.play-btn {
  background: none;
  border: 2px solid #7fdbca;
  color: #7fdbca;
  font-family: 'Courier New', monospace;
  font-size: 20px;
  padding: 12px 40px;
  cursor: pointer;
  transition: all 0.2s;
}

button.play-btn:hover {
  background: #7fdbca;
  color: #0a0a1a;
}

.hidden { display: none !important; }
</style>
</head>
<body>

<div id="start-screen">
  <h1>( SEXP DEFENDERS )</h1>
  <div class="subtitle">ppx_sexp_conv :: the arcade experience</div>
  <div class="instructions">
    <kbd>&larr;</kbd> <kbd>&rarr;</kbd> or <kbd>A</kbd> <kbd>D</kbd> to move<br>
    <kbd>SPACE</kbd> to fire conversion beams<br>
    Convert malformed sexps before they corrupt the heap!<br>
    Chain conversions for combo multipliers
  </div>
  <button class="play-btn" onclick="startGame()">( start )</button>
</div>

<div id="game-over-screen" class="hidden">
  <h1>SEGFAULT</h1>
  <div class="final-score">Score: <span id="final-score-val">0</span></div>
  <div class="instructions">
    Wave: <span id="final-wave">1</span> | Conversions: <span id="final-conversions">0</span>
  </div>
  <button class="play-btn" onclick="startGame()">( retry )</button>
</div>

<div id="hud" class="hidden">
  <span>SCORE: <b id="score-val">0</b></span>
  <span>WAVE: <b id="wave-val">1</b></span>
  <span>COMBO: <b id="combo-val">x1</b></span>
  <span>LIVES: <b id="lives-val">&#x2764;&#x2764;&#x2764;</b></span>
</div>

<canvas id="game" class="hidden"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = 800, H = 600;
canvas.width = W;
canvas.height = H;

// Game state
let game = null;

const SEXP_ENEMIES = [
  '(list 1 2 3)',
  '(option Some)',
  '(record (x 1))',
  '(variant Foo)',
  '(tuple 1 "a")',
  '(array #[])',
  '(poly `Bar)',
  '(gadt T int)',
  '(exn Not_found)',
  '(hashtbl ())',
  '((a 1)(b 2))',
  '(Atom "hello")',
  '(List ())',
  '(sexp.opaque _)',
  '(@default 0)',
  '(of_sexp_error)',
  '(Sexp.t list)',
  '(ppx_deriving)',
  '((malformed )',
  '( unbalanced))',
  '(((nested)))',
  '(type_conv _)',
];

const CONVERTED_MESSAGES = [
  '@@deriving sexp',
  'sexp_of_t',
  't_of_sexp',
  'Sexp.to_string',
  'converted!',
  'serialized!',
  'well-typed!',
  'ppx_applied!',
];

class Particle {
  constructor(x, y, color, vx, vy, life) {
    this.x = x; this.y = y;
    this.color = color;
    this.vx = vx; this.vy = vy;
    this.life = life;
    this.maxLife = life;
  }
  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.life -= dt;
  }
  draw() {
    const alpha = Math.max(0, this.life / this.maxLife);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.fillText('(', this.x, this.y);
    ctx.globalAlpha = 1;
  }
}

class FloatingText {
  constructor(x, y, text, color) {
    this.x = x; this.y = y;
    this.text = text; this.color = color;
    this.life = 1.0;
  }
  update(dt) {
    this.y -= 40 * dt;
    this.life -= dt;
  }
  draw() {
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = this.color;
    ctx.font = '14px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(this.text, this.x, this.y);
    ctx.globalAlpha = 1;
  }
}

class Bullet {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.speed = 500;
    this.width = 3;
    this.height = 16;
    this.alive = true;
  }
  update(dt) {
    this.y -= this.speed * dt;
    if (this.y < -20) this.alive = false;
  }
  draw() {
    // Glowing beam
    ctx.shadowColor = '#7fdbca';
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#7fdbca';
    ctx.fillRect(this.x - 1, this.y, this.width, this.height);
    ctx.shadowBlur = 0;

    // Beam label
    ctx.font = '9px Courier New';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#c3f0e8';
    ctx.fillText('sexp', this.x + 1, this.y - 2);
  }
}

class Enemy {
  constructor(x, y, text, hp, speed, points) {
    this.x = x; this.y = y;
    this.text = text;
    this.hp = hp; this.maxHp = hp;
    this.speed = speed;
    this.points = points;
    this.alive = true;
    this.width = ctx.measureText(text).width || text.length * 9;
    this.height = 20;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 1 + Math.random() * 2;
    this.wobbleAmp = 20 + Math.random() * 30;
  }
  update(dt) {
    this.y += this.speed * dt;
    this.wobble += this.wobbleSpeed * dt;
    this.renderX = this.x + Math.sin(this.wobble) * this.wobbleAmp;
    if (this.y > H + 20) {
      this.alive = false;
      return 'escaped';
    }
    return null;
  }
  draw() {
    const hpRatio = this.hp / this.maxHp;
    // Color shifts from red (damaged) to original
    const r = Math.floor(247 * (1 - hpRatio) + 199 * hpRatio);
    const g = Math.floor(140 * (1 - hpRatio) + 146 * hpRatio);
    const b = Math.floor(108 * (1 - hpRatio) + 234 * hpRatio);
    const color = `rgb(${r},${g},${b})`;

    ctx.font = '16px Courier New';
    ctx.textAlign = 'center';

    // Glow for high HP enemies
    if (this.maxHp > 1) {
      ctx.shadowColor = color;
      ctx.shadowBlur = 6;
    }

    ctx.fillStyle = color;
    ctx.fillText(this.text, this.renderX, this.y);
    ctx.shadowBlur = 0;

    // HP bar for multi-hit enemies
    if (this.maxHp > 1) {
      const barW = this.width;
      const barH = 3;
      const bx = this.renderX - barW / 2;
      const by = this.y + 6;
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(bx, by, barW, barH);
      ctx.fillStyle = hpRatio > 0.5 ? '#7fdbca' : '#f78c6c';
      ctx.fillRect(bx, by, barW * hpRatio, barH);
    }
  }
  hitTest(bx, by, bw, bh) {
    return (
      bx < this.renderX + this.width / 2 &&
      bx + bw > this.renderX - this.width / 2 &&
      by < this.y + 5 &&
      by + bh > this.y - 15
    );
  }
}

class Player {
  constructor() {
    this.x = W / 2;
    this.y = H - 50;
    this.speed = 300;
    this.width = 40;
    this.cooldown = 0;
    this.fireRate = 0.18;
  }
  update(dt, keys) {
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) this.x -= this.speed * dt;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) this.x += this.speed * dt;
    this.x = Math.max(20, Math.min(W - 20, this.x));
    this.cooldown = Math.max(0, this.cooldown - dt);
  }
  fire() {
    if (this.cooldown <= 0) {
      this.cooldown = this.fireRate;
      return new Bullet(this.x, this.y - 15);
    }
    return null;
  }
  draw() {
    // Draw the converter ship as an s-expression
    ctx.font = 'bold 20px Courier New';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#7fdbca';
    ctx.shadowColor = '#7fdbca';
    ctx.shadowBlur = 10;
    ctx.fillText('(\\)', this.x, this.y);
    ctx.shadowBlur = 0;

    ctx.font = '10px Courier New';
    ctx.fillStyle = '#3a6a7a';
    ctx.fillText('ppx_sexp_conv', this.x, this.y + 14);
  }
}

function initGame() {
  return {
    player: new Player(),
    bullets: [],
    enemies: [],
    particles: [],
    floatingTexts: [],
    score: 0,
    lives: 3,
    wave: 1,
    combo: 0,
    comboTimer: 0,
    comboMultiplier: 1,
    totalConversions: 0,
    waveTimer: 0,
    waveSpawnCount: 0,
    waveEnemyCount: 0,
    spawnInterval: 1.5,
    running: true,
    keys: {},
    starfield: createStarfield(),
  };
}

function createStarfield() {
  const stars = [];
  for (let i = 0; i < 80; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() * 1.5 + 0.5,
      speed: Math.random() * 20 + 5,
      brightness: Math.random() * 0.5 + 0.2,
      // Some stars are parens
      isParen: Math.random() < 0.15,
    });
  }
  return stars;
}

function spawnWaveEnemies() {
  const g = game;
  const wave = g.wave;
  const baseSpeed = 30 + wave * 8;
  const count = 5 + wave * 3;

  g.waveEnemyCount = count;
  g.waveSpawnCount = 0;
  g.spawnInterval = Math.max(0.4, 1.5 - wave * 0.08);
  g.waveTimer = 0;
}

function spawnEnemy() {
  const g = game;
  const wave = g.wave;
  const text = SEXP_ENEMIES[Math.floor(Math.random() * SEXP_ENEMIES.length)];
  const x = 60 + Math.random() * (W - 120);
  const baseSpeed = 30 + wave * 8;

  let hp = 1;
  let speed = baseSpeed + Math.random() * 20;
  let points = 10;

  // Tougher enemies in later waves
  if (wave >= 3 && Math.random() < 0.3) {
    hp = 2;
    points = 25;
    speed *= 0.8;
  }
  if (wave >= 6 && Math.random() < 0.2) {
    hp = 3;
    points = 50;
    speed *= 0.7;
  }

  // Measure text width
  ctx.font = '16px Courier New';

  g.enemies.push(new Enemy(x, -20, text, hp, speed, points));
  g.waveSpawnCount++;
}

function spawnConversionParticles(x, y) {
  const chars = ['(', ')', '@', '@', 'd', 'e', 'r', 'i', 'v', 'i', 'n', 'g'];
  const colors = ['#7fdbca', '#c792ea', '#f78c6c', '#82aaff', '#c3e88d'];
  for (let i = 0; i < 8; i++) {
    const angle = (Math.PI * 2 * i) / 8;
    const speed = 60 + Math.random() * 80;
    game.particles.push(new Particle(
      x, y,
      colors[Math.floor(Math.random() * colors.length)],
      Math.cos(angle) * speed,
      Math.sin(angle) * speed,
      0.6 + Math.random() * 0.4
    ));
  }
}

function updateHUD() {
  document.getElementById('score-val').textContent = game.score;
  document.getElementById('wave-val').textContent = game.wave;
  document.getElementById('combo-val').textContent = 'x' + game.comboMultiplier;
  document.getElementById('combo-val').style.color =
    game.comboMultiplier > 1 ? '#f78c6c' : '#7fdbca';
  const hearts = '\u2764'.repeat(game.lives);
  document.getElementById('lives-val').textContent = hearts || '\u2620';
}

function gameOver() {
  game.running = false;
  document.getElementById('final-score-val').textContent = game.score;
  document.getElementById('final-wave').textContent = game.wave;
  document.getElementById('final-conversions').textContent = game.totalConversions;
  document.getElementById('game-over-screen').classList.remove('hidden');
  canvas.classList.add('hidden');
  document.getElementById('hud').classList.add('hidden');
}

let lastTime = 0;

function gameLoop(timestamp) {
  if (!game || !game.running) return;

  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  // Update starfield
  game.starfield.forEach(s => {
    s.y += s.speed * dt;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  });

  // Player
  game.player.update(dt, game.keys);
  if (game.keys[' ']) {
    const b = game.player.fire();
    if (b) game.bullets.push(b);
  }

  // Bullets
  game.bullets.forEach(b => b.update(dt));
  game.bullets = game.bullets.filter(b => b.alive);

  // Wave spawning
  game.waveTimer += dt;
  if (game.waveSpawnCount < game.waveEnemyCount && game.waveTimer >= game.spawnInterval) {
    game.waveTimer = 0;
    spawnEnemy();
  }

  // Check wave complete
  if (game.waveSpawnCount >= game.waveEnemyCount && game.enemies.length === 0) {
    game.wave++;
    spawnWaveEnemies();
    game.floatingTexts.push(new FloatingText(W / 2, H / 2, `-- Wave ${game.wave} --`, '#c792ea'));
  }

  // Combo timer
  if (game.comboTimer > 0) {
    game.comboTimer -= dt;
    if (game.comboTimer <= 0) {
      game.combo = 0;
      game.comboMultiplier = 1;
    }
  }

  // Enemies
  for (const enemy of game.enemies) {
    const result = enemy.update(dt);
    if (result === 'escaped') {
      game.lives--;
      game.combo = 0;
      game.comboMultiplier = 1;
      game.floatingTexts.push(new FloatingText(enemy.renderX, H - 30, 'HEAP CORRUPTION!', '#ff5370'));
      if (game.lives <= 0) {
        gameOver();
        return;
      }
    }
  }

  // Collision detection
  for (const bullet of game.bullets) {
    for (const enemy of game.enemies) {
      if (!enemy.alive || !bullet.alive) continue;
      if (enemy.hitTest(bullet.x, bullet.y, bullet.width, bullet.height)) {
        bullet.alive = false;
        enemy.hp--;
        if (enemy.hp <= 0) {
          enemy.alive = false;
          game.combo++;
          game.comboTimer = 2.0;
          game.comboMultiplier = Math.min(8, 1 + Math.floor(game.combo / 3));
          const pts = enemy.points * game.comboMultiplier;
          game.score += pts;
          game.totalConversions++;
          spawnConversionParticles(enemy.renderX, enemy.y);
          const msg = CONVERTED_MESSAGES[Math.floor(Math.random() * CONVERTED_MESSAGES.length)];
          game.floatingTexts.push(new FloatingText(enemy.renderX, enemy.y - 10, `+${pts} ${msg}`, '#c3e88d'));
        } else {
          game.floatingTexts.push(new FloatingText(enemy.renderX, enemy.y - 10, 'hit!', '#ffcb6b'));
        }
      }
    }
  }

  game.enemies = game.enemies.filter(e => e.alive);

  // Particles
  game.particles.forEach(p => p.update(dt));
  game.particles = game.particles.filter(p => p.life > 0);

  // Floating texts
  game.floatingTexts.forEach(t => t.update(dt));
  game.floatingTexts = game.floatingTexts.filter(t => t.life > 0);

  // --- DRAW ---
  ctx.clearRect(0, 0, W, H);

  // Starfield
  game.starfield.forEach(s => {
    ctx.globalAlpha = s.brightness;
    if (s.isParen) {
      ctx.font = '10px Courier New';
      ctx.fillStyle = '#2a3a4a';
      ctx.fillText(Math.random() < 0.5 ? '(' : ')', s.x, s.y);
    } else {
      ctx.fillStyle = '#4a5a6a';
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }
    ctx.globalAlpha = 1;
  });

  // Enemies
  game.enemies.forEach(e => e.draw());

  // Bullets
  game.bullets.forEach(b => b.draw());

  // Player
  game.player.draw();

  // Particles
  ctx.font = '12px Courier New';
  game.particles.forEach(p => p.draw());

  // Floating texts
  game.floatingTexts.forEach(t => t.draw());

  updateHUD();
  requestAnimationFrame(gameLoop);
}

function startGame() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('game-over-screen').classList.add('hidden');
  canvas.classList.remove('hidden');
  document.getElementById('hud').classList.remove('hidden');

  game = initGame();
  spawnWaveEnemies();

  document.onkeydown = (e) => {
    game.keys[e.key] = true;
    if (e.key === ' ') e.preventDefault();
  };
  document.onkeyup = (e) => { game.keys[e.key] = false; };

  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
